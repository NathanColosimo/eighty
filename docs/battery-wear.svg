<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Battery wear: heat and charging to 100%"><rect width="1600" height="900" fill="#fcfcfb"/><text x="80" y="120" font-size="52" font-weight="750" fill="#0b0b0b" text-anchor="start">Plugged in all day? Two things wear out your battery.</text><text x="80" y="172" font-size="26" font-weight="400" fill="#52514e" text-anchor="start">Eighty fixes both, for free: it stops charging at 80% and pauses charging while the battery is hot.</text><text x="80" y="300" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">1. Heat</text><text x="80" y="340" font-size="22" font-weight="400" fill="#52514e" text-anchor="start">Capacity left after a year kept at 100%</text><text x="80" y="770" font-size="24" font-weight="600" fill="#0b0b0b" text-anchor="start">Heat nearly doubles the loss: 20% → 35% a year.</text><line x1="250.0" y1="380" x2="250.0" y2="690" stroke="#e6e5e1" stroke-width="1"/><text x="250.0" y="718" font-size="18" font-weight="400" fill="#8a8984" text-anchor="middle">0%</text><line x1="370.0" y1="380" x2="370.0" y2="690" stroke="#e6e5e1" stroke-width="1"/><text x="370.0" y="718" font-size="18" font-weight="400" fill="#8a8984" text-anchor="middle">25%</text><line x1="490.0" y1="380" x2="490.0" y2="690" stroke="#e6e5e1" stroke-width="1"/><text x="490.0" y="718" font-size="18" font-weight="400" fill="#8a8984" text-anchor="middle">50%</text><line x1="610.0" y1="380" x2="610.0" y2="690" stroke="#e6e5e1" stroke-width="1"/><text x="610.0" y="718" font-size="18" font-weight="400" fill="#8a8984" text-anchor="middle">75%</text><line x1="730.0" y1="380" x2="730.0" y2="690" stroke="#e6e5e1" stroke-width="1"/><text x="730.0" y="718" font-size="18" font-weight="400" fill="#8a8984" text-anchor="middle">100%</text><text x="80" y="438" font-size="24" font-weight="400" fill="#52514e" text-anchor="start">Cool  0 °C</text><path d="M250,400 H697.2 Q701.2,400 701.2,404 V452 Q701.2,456 697.2,456 H250 Z" fill="#c9c8c2"/><text x="713.2" y="438" font-size="24" font-weight="650" fill="#0b0b0b" text-anchor="start">94%</text><text x="80" y="536" font-size="24" font-weight="400" fill="#52514e" text-anchor="start">Room  25 °C</text><path d="M250,498 H630.0 Q634.0,498 634.0,502 V550 Q634.0,554 630.0,554 H250 Z" fill="#c9c8c2"/><text x="646.0" y="536" font-size="24" font-weight="650" fill="#0b0b0b" text-anchor="start">80%</text><text x="80" y="634" font-size="24" font-weight="400" fill="#52514e" text-anchor="start">Warm  40 °C</text><path d="M250,596 H558.0 Q562.0,596 562.0,600 V648 Q562.0,652 558.0,652 H250 Z" fill="#eb6834"/><text x="574.0" y="634" font-size="24" font-weight="650" fill="#0b0b0b" text-anchor="start">65%</text><text x="860" y="300" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start">2. Charging to 100%</text><text x="860" y="340" font-size="22" font-weight="400" fill="#52514e" text-anchor="start">Charge cycles before the battery is worn, by where charging stops</text><text x="860" y="770" font-size="24" font-weight="600" fill="#0b0b0b" text-anchor="start">Stopping at ~80% roughly doubles battery life.</text><line x1="970.0" y1="380" x2="970.0" y2="690" stroke="#e6e5e1" stroke-width="1"/><text x="970.0" y="718" font-size="18" font-weight="400" fill="#8a8984" text-anchor="middle">0</text><line x1="1087.5" y1="380" x2="1087.5" y2="690" stroke="#e6e5e1" stroke-width="1"/><text x="1087.5" y="718" font-size="18" font-weight="400" fill="#8a8984" text-anchor="middle">250</text><line x1="1205.0" y1="380" x2="1205.0" y2="690" stroke="#e6e5e1" stroke-width="1"/><text x="1205.0" y="718" font-size="18" font-weight="400" fill="#8a8984" text-anchor="middle">500</text><line x1="1322.5" y1="380" x2="1322.5" y2="690" stroke="#e6e5e1" stroke-width="1"/><text x="1322.5" y="718" font-size="18" font-weight="400" fill="#8a8984" text-anchor="middle">750</text><line x1="1440.0" y1="380" x2="1440.0" y2="690" stroke="#e6e5e1" stroke-width="1"/><text x="1440.0" y="718" font-size="18" font-weight="400" fill="#8a8984" text-anchor="middle">1,000</text><text x="860" y="438" font-size="24" font-weight="400" fill="#52514e" text-anchor="start">100%</text><rect x="1111.0" y="400" width="94.0" height="56" rx="4" fill="#c9c8c2"/><text x="1217.0" y="438" font-size="24" font-weight="650" fill="#0b0b0b" text-anchor="start">300–500</text><text x="860" y="536" font-size="24" font-weight="400" fill="#52514e" text-anchor="start">~90%</text><rect x="1158.0" y="498" width="141.0" height="56" rx="4" fill="#c9c8c2"/><text x="1311.0" y="536" font-size="24" font-weight="650" fill="#0b0b0b" text-anchor="start">400–700</text><text x="860" y="634" font-size="24" font-weight="400" fill="#52514e" text-anchor="start">~80%</text><rect x="1252.0" y="596" width="188.0" height="56" rx="4" fill="#1baf7a"/><text x="1452.0" y="634" font-size="24" font-weight="650" fill="#0b0b0b" text-anchor="start">600–1,000</text><text x="1252.0" y="682" font-size="20" font-weight="600" fill="#52514e" text-anchor="start">Eighty’s default</text><line x1="80" y1="815" x2="1520" y2="815" stroke="#e6e5e1" stroke-width="1"/><text x="1520" y="855" font-size="20" font-weight="600" fill="#52514e" text-anchor="end">github.com/NathanColosimo/eighty</text></svg>
