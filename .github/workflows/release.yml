name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 45
    # Signing secrets live in this environment, which only v* tags can use.
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the version
        run: |
          version=$(sed -n 's/.*eightyVersion = "\(.*\)"/\1/p' Sources/EightyKit/Version.swift)
          test "v$version" = "$GITHUB_REF_NAME"
      - run: swift test
      - name: Import the Developer ID certificate into a temporary keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          rm "$RUNNER_TEMP/cert.p12"
          echo "EIGHTY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build and sign
        run: |
          . scripts/release.env
          EIGHTY_SIGN_IDENTITY="$DEVELOPER_ID" scripts/build-app.sh
      - name: Notarize
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          export NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$NOTARY_KEY_P8" > "$NOTARY_KEY"
          scripts/notarize.sh
          rm "$NOTARY_KEY"
      - name: Delete the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .build/Eighty-*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . scripts/release.env
          gh release create "$GITHUB_REF_NAME" .build/Eighty-*.zip \
            --title "Eighty ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Requires macOS $MIN_MACOS or later on Apple silicon. Signed and notarized. Install: \`brew install --cask nathancolosimo/tap/eighty\`"
